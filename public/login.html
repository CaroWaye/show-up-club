<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6ef">
  <title>Log in · Show Up Club</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..800,0..100;1,9..144,400..800,0..100&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <main class="shell login">
    <div class="brand">
      <span class="brand-mark">♥</span>
      <span class="brand-word">Show Up <span>Club</span></span>
    </div>
    <header class="page-head">
      <h1 class="display chrome">Welcome back</h1>
      <p class="script tagline">you never regret showing up</p>
    </header>
    <form class="card login-card" id="login">
      <!-- lets your phone's password manager save the password under a name -->
      <input class="sr-only" type="text" name="username" autocomplete="username" value="Show Up Club" tabindex="-1" aria-hidden="true">
      <label class="field">
        <span class="label">Password</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="login-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary btn-block">Log in</button>
    </form>
  </main>
</body>
</html>
